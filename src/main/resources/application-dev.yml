spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
    com.medexa: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
